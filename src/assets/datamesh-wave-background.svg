<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Teal data mesh wave background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#062B34"/>
      <stop offset="0.48" stop-color="#041B24"/>
      <stop offset="1" stop-color="#020B13"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="62%">
      <stop offset="0" stop-color="#02E6FF" stop-opacity="0.22"/>
      <stop offset="0.38" stop-color="#00BBD6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#001018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#009AB5" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#00E5FF" stop-opacity="0.65"/>
      <stop offset="0.5" stop-color="#1BFFFF" stop-opacity="0.95"/>
      <stop offset="0.82" stop-color="#00D7F0" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#009AB5" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-40%" width="120%" height="180%">
