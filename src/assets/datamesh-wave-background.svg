        <stop offset="0.24" stop-color="white" stop-opacity="1"/>
        <stop offset="0.72" stop-color="white" stop-opacity="0.9"/>
        <stop offset="1" stop-color="white" stop-opacity="0"/>
      </linearGradient>
      <rect y="90" width="1600" height="450" fill="url(#verticalFade)"/>
    </mask>
  </defs>

  <rect width="1600" height="560" fill="url(#bg)"/>
  <rect width="1600" height="560" fill="url(#glow)"/>

